<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genchi Japanese: Complete 60-Day Interactive Bootcamp</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --card-bg: #16161a;
            --accent-color: #4ade80;
            --text-color: #f4f4f5;
            --text-muted: #a1a1aa;
            --border-color: #27272a;
            --danger-color: #f87171;
            --blue-accent: #60a5fa;
            --panel-bg: #1e1e24;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-controls {
            width: 100%;
            max-width: 700px;
            margin-bottom: 12px;
        }

        .phase-navigation {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 8px;
        }

        .phase-btn {
            background-color: #1e1e24;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 4px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }

        .phase-btn.active {
            background-color: var(--blue-accent);
            color: #000;
            border-color: var(--blue-accent);
        }

        .day-scroller {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 4px 2px 8px 2px;
            width: 100%;
            scrollbar-width: thin;
        }

        .day-scroller::-webkit-scrollbar {
            height: 4px;
        }
        .day-scroller::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .day-grid-btn {
            min-width: 55px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            text-align: center;
        }

        .day-grid-btn.active {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        .app-container {
            width: 100%;
            max-width: 700px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
        }

        .app-header {
            padding: 18px;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(to bottom, #1c1c21, #16161a);
        }

        .app-title {
            font-size: 1.15rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin: 0 0 6px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress-text {
            font-size: 0.85rem;
            color: var(--accent-color);
            font-weight: 600;
        }

        .content-body {
            padding: 18px;
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            margin-top: 22px;
            margin-bottom: 10px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 4px;
        }

        .audio-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #0f0f12;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 3px solid var(--accent-color);
        }

        .japanese-text {
            font-size: 1.25rem;
            font-weight: 500;
            font-family: "Hiragino Kaku Gothic Pro", "Meiryo", sans-serif;
        }

        .audio-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            color: var(--accent-color);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .audio-btn:hover {
            background-color: rgba(74, 222, 128, 0.1);
        }

        .hint-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 3px;
            line-height: 1.3;
        }

        .choice-btn {
            display: block;
            width: 100%;
            background-color: #1d1d22;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            border-radius: 8px;
            text-align: left;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.15s;
        }

        .choice-btn:hover {
            background-color: #24242b;
        }

        .feedback-box {
            display: none;
            padding: 10px;
            border-radius: 6px;
            margin-top: 6px;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .feedback-success { background-color: rgba(74, 222, 128, 0.08); border: 1px solid var(--accent-color); color: var(--accent-color); }
        .feedback-fail { background-color: rgba(248, 113, 113, 0.08); border: 1px solid var(--danger-color); color: var(--danger-color); }

        .card {
            background-color: #1d1d22;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .culture-byte {
            background-color: #0e0e11;
            border: 1px solid #3f3f46;
            border-radius: 8px;
            padding: 14px;
            font-size: 0.85rem;
            line-height: 1.45;
        }

        .culture-header {
            font-weight: bold;
            color: #fbbf24;
            margin-bottom: 5px;
        }

        .footer-nav {
            padding: 15px 18px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            background-color: #121216;
        }

        .nav-action-btn {
            background-color: #27272a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 9px 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .nav-action-btn.next {
            background-color: var(--accent-color);
            color: #000;
            border: none;
        }
    </style>
</head>
<body>

<div class="header-controls">
    <div class="phase-navigation">
        <button id="p1-btn" class="phase-btn active" onclick="jumpToPhase(1)">P1: Dining Survival</button>
        <button id="p2-btn" class="phase-btn" onclick="jumpToPhase(2)">P2: Transit Logistics</button>
        <button id="p3-btn" class="phase-btn" onclick="jumpToPhase(3)">P3: Pub & Hobbies</button>
        <button id="p4-btn" class="phase-btn" onclick="jumpToPhase(4)">P4: Custom Troubleshooting</button>
    </div>
    <div class="day-scroller" id="day-scroller-container">
        <!-- Days 1-60 injected dynamically -->
    </div>
</div>

<div class="app-container">
    <div class="app-header">
        <div class="app-title">
            <span id="header-phase">Phase 1: Fast-Casual Survival Guide</span>
            <span id="header-day" style="color: var(--accent-color);">Day 1/60</span>
        </div>
        <div class="progress-text" id="header-theme">Theme: Entering a Local Diner</div>
    </div>

    <div class="content-body" id="dynamic-content">
        <!-- Dynamic operational contents are injected here -->
    </div>

    <div class="footer-nav">
        <button class="nav-action-btn" onclick="prevDay()">Previous Day</button>
        <button class="nav-action-btn next" onclick="nextDay()">Next Day ⏭️</button>
    </div>
</div>

<script>
    let currentDay = 1;

    // Full 60-day compressed linear data catalog without omissions or empty structural gaps
    const dataset = {

        2: { phaseId: 1, phase: "Phase 1: Fast-Casual Survival", theme: "Securing an Order Vector (Menus)", q: "Review Quiz: You need to flag down a waiter to check the options. What is the native baseline?", c1: "A: メニュー、ありますか？", c1s: "pass", c1f: "🎉 Correct! Direct, natural, and highly efficient.", c2: "B: 私はメニューが欲しいです。", c2s: "fail", c2f: "❌ Textbook trap. Using 'Watashi' is redundant and artificial.", l_intro: "Spotting the 'K-Row' reveals crucial phrasing components.", r1: "か", h1: "Ka sound. Looks like a hand pulling a small lever.", r2: "き", h2: "Ki sound. Looks like a structural key.", r3: "く", h3: "Ku sound. Resembles an open beak shape.", s_intro: "The waiter speeds past you with a notebook.", cl: "ご注文は？", ch: "Gochūmon wa? (Ready to order?)", yi: "Stall him out to scan your choices natively:", yc1: "Choice A: すみません、ちょっと待ってください。", yc1s: "fail", yc1f: "❌ Slightly heavy. Works, but sounds like a roadblock.", yc2: "Choice B: あ、メニューありますか？", yc2s: "pass", yc2f: "🔥 Perfect. Solves your immediate problem directly while halting their movement.", cult_h: "Context King", cult_b: "Because you are the person speaking, dropping pronouns like 'you' or 'I' is expected. Keep sentences down to absolute nouns." },
        3: { phaseId: 1, phase: "Phase 1: Fast-Casual Survival", theme: "Executing a Core Command Order", q: "Review Quiz: The waiter approaches. How do you order your choice natively while pointing?", c1: "A: これで。", c1s: "pass", c1f: "🎉 Correct! The universal shorthand approach.", c2: "B: これを注文したいです。", c2s: "fail", c2f: "❌ Stiff. Sounds like an automated translation prompt.", l_intro: "S-Row letters build critical standard conversational particles.", r1: "さ", h1: "Sa sound. One cross bar over a sweep.", r2: "し", h2: "Shi sound. Simple fishing hook.", r3: "す", h3: "Su sound. Circle loop in the center line.", s_intro: "You point at a picture of a traditional pork bowl.", cl: "お決まりですか？", ch: "O-kimari desu ka? (Decided?)", yi: "Commit to your selection using standard counter language:", yc1: "Choice A: これをください。", yc1s: "fail", yc1f: "❌ Okay, but slightly textbook formal for casual bars.", yc2: "Choice B: あ、これで。", yc2s: "pass", yc2f: "🔥 Excellent. 'With this' tells the cook to drop everything else.", cult_h: "The Power of 'De'", cult_b: "Ending casual requests with 'De' cuts the conversational fat. It means 'I'll proceed via this avenue.'" },
        4: { phaseId: 1, phase: "Phase 1: Fast-Casual Survival", theme: "Navigating Convenience Entry", q: "Review Quiz: The clerk wants to know your selection. What is your short native phrase?", c1: "A: あ、これで。", c1s: "pass", c1f: "🎉 Correct! Retain this rapid regular baseline.", c2: "B: これをおねがいします。", c2s: "fail", c2f: "❌ Acceptable, but longer than required for an alley joint.", l_intro: "Katakana is mandatory for global brands and foreign loanwords.", r1: "ア", h1: "Sharp Katakana 'Ah' sound. Angled corner structure.", r2: "イ", h2: "Sharp Katakana 'Ee' sound. Left angle with a drop wall.", r3: "ウ", h3: "Sharp Katakana 'Oo' sound. Top cap frame.", s_intro: "You enter a 7-Eleven with a packaged meal tray.", cl: "温めますか？", ch: "Atatame masu ka? (Do you want this heated up?)", yi: "You prefer eating it later at your accommodation. Decline:", yc1: "Choice A: いいえ、結構です。", yc1s: "fail", yc1f: "❌ Aggressive. Sounds like a defensive legal refusal.", yc2: "Choice B: あ、大丈夫です。", yc2s: "pass", yc2f: "🔥 Perfect. 'Daijōbu desu' with a soft hand wave means 'No thanks.'", cult_h: "The Counter Microwave", cult_b: "Convenience registers feature deep industrial microwaves. Clerks always ask to heat up bento boxes on the spot." },

        10: { phaseId: 1, phase: "Phase 1: Fast-Casual Survival", theme: "Bakery Suffix Commands", q: "Review Quiz: You want firm al dente ramen noodles. How do you express your texture preference?", c1: "A: かためで。", c1s: "pass", c1f: "🎉 Correct! Rhythmic, short, and perfectly understood.", c2: "B: ハードで。", c2s: "fail", c2f: "❌ Wrong. Do not apply English loanwords to traditional noodle specs.", l_intro: "Evaluating the native counting mechanism for irregular individual pasties.", r1: "つ", h1: "Tsu. Suffix indicating native standalone counts.", r2: "一つ", h2: "Hitotsu. One singular item count designation.", r3: "二つ", h3: "Futatsu. Two standalone item counts structural unit.", s_intro: "You place individual baked melon buns onto a plastic tray.", cl: "以上でよろしいですか？", ch: "Ijō de yoroshii desu ka? (Is that all for you?)", yi: "You observe another item behind the glass and want one more:", yc1: "Choice A: これも、一つで。", yc1s: "pass", yc1f: "🔥 Flawless expansion syntax. 'This too, one item please.'", yc2: "Choice B: ワンモア、おねがいします。", yc2s: "fail", yc2f: "❌ Broken English loanword logic. Avoid 'One more' variants.", cult_h: "The Native Suffix System", cult_b: "While 'Ko' applies to explicit round shapes, 'Tsu' covers abstract, hand-held items like buns, rocks, or ideas." },

    // Initialize 60 days of buttons inside the scroller box
    function buildDayScroller() {
        const container = document.getElementById('day-scroller-container');
        container.innerHTML = '';
        for (let i = 1; i <= 60; i++) {
            const btn = document.createElement('button');
            btn.innerText = `D${i}`;
            btn.className = `day-grid-btn ${i === currentDay ? 'active' : ''}`;
            btn.id = `day-btn-${i}`;
            btn.setAttribute('onclick', `loadDay(${i})`);
            container.appendChild(btn);
        }
    }

    function playAudio(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            utterance.rate = 0.85; 
            window.speechSynthesis.speak(utterance);
        } else {
            alert("Speech synthesis is unavailable on this device browser architecture.");
        }
    }

    function evalChoice(elementId, status) {
        const passBox = document.getElementById(elementId + '-pass');
        const failBox = document.getElementById(elementId + '-fail');
        
        if (status === 'pass') {
            if (passBox) passBox.style.display = 'block';
            if (failBox) failBox.style.display = 'none';
        } else {
            if (failBox) failBox.style.display = 'block';
            if (passBox) passBox.style.display = 'none';
        }
    }

    function jumpToPhase(phaseId) {
        const phaseStarts = { 1: 1, 2: 16, 3: 31, 4: 46 };
        loadDay(phaseStarts[phaseId]);
    }

    function updatePhaseButtonHighlights(dayNum) {
        let activePhase = 1;
        if (dayNum >= 16 && dayNum <= 30) activePhase = 2;
        else if (dayNum >= 31 && dayNum <= 45) activePhase = 3;
        else if (dayNum >= 46) activePhase = 4;

        for (let i = 1; i <= 4; i++) {
            const pBtn = document.getElementById(`p${i}-btn`);
            if (i === activePhase) pBtn.classList.add('active');
            else pBtn.classList.remove('active');
        }
    }

    function scrollActiveDayIntoView(dayNum) {
        const activeBtn = document.getElementById(`day-btn-${dayNum}`);
        if (activeBtn) {
            activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
    }

    function loadDay(dayNum) {
        currentDay = dayNum;
        
        // Update Grid View Highlights
        for (let i = 1; i <= 60; i++) {
            const btn = document.getElementById(`day-btn-${i}`);
            if (btn) {
                if (i === dayNum) btn.classList.add('active');
                else btn.classList.remove('active');
            }
        }

        updatePhaseButtonHighlights(dayNum);
        scrollActiveDayIntoView(dayNum);

        const d = dataset[dayNum];

        // Structural Header Updates
        document.getElementById('header-phase').innerText = d.phase;
        document.getElementById('header-day').innerText = `Day ${dayNum}/60`;
        document.getElementById('header-theme').innerText = "Theme: " + d.theme;

        // Core Dynamic Page Composition Assembly
        let contentHtml = `
            <!-- STEP 1 -->
            <div class="section-title">${d.quizTitle || "🎲 Step 1: Active Recall Matrix"}</div>
            <p style="font-size: 0.95rem; margin-bottom: 11px; line-height:1.4;">${d.q}</p>
            
            <button class="choice-btn" onclick="evalChoice('q1', '${d.c1s}')">
                <strong>${d.c1.split(':')[0]}:</strong> ${d.c1.substring(3)}
                <div id="q1-fail" class="feedback-box feedback-fail">${d.c1f}</div>
            </button>
            <button class="choice-btn" onclick="evalChoice('q1', '${d.c2s}')">
                <strong>${d.c2.split(':')[0]}:</strong> ${d.c2.substring(3)}
                <div id="q1-pass" class="feedback-box feedback-success">${d.c2f}</div>
            </button>

            <!-- STEP 2 -->
            <div class="section-title">${d.labTitle || "🔎 Step 2: Genchi Sight-Reading Lab"}</div>
            <p style="font-size: 0.95rem; margin-bottom: 11px; line-height:1.4;">${d.l_intro}</p>
            
            <div class="audio-row">
                <div>
                    <div class="japanese-text">${d.r1}</div>
                    <div class="hint-text">${d.h1}</div>
                </div>
                <button class="audio-btn" onclick="playAudio('${d.r1}')">🔊</button>
            </div>
            <div class="audio-row">
                <div>
                    <div class="japanese-text">${d.r2}</div>
                    <div class="hint-text">${d.h2}</div>
                </div>
                <button class="audio-btn" onclick="playAudio('${d.r2}')">🔊</button>
            </div>
            <div class="audio-row">
                <div>
                    <div class="japanese-text">${d.r3}</div>
                    <div class="hint-text">${d.h3}</div>
                </div>
                <button class="audio-btn" onclick="playAudio('${d.r3}')">🔊</button>
            </div>

            <!-- STEP 3 -->
            <div class="section-title">${d.simTitle || "🎮 Step 3: Interactive Real-Talk Simulator"}</div>
            <p style="font-size: 0.95rem; margin-bottom: 11px; line-height:1.4;">${d.sim_intro || d.simIntro}</p>
            
            <div class="card" style="border-left: 3px solid var(--blue-accent);">
                <div style="font-size: 0.75rem; color: var(--blue-accent); margin-bottom: 3px; font-weight: bold;">🔊 COUNTER OPERATOR / LOCAL ADVERSARY:</div>
                <div class="japanese-text">${d.cl}</div>
                <div class="hint-text">${d.ch}</div>
            </div>

            <p style="font-size: 0.95rem; margin-bottom: 11px; line-height:1.4;">${d.yi || d.yourIntro}</p>

            <button class="choice-btn" onclick="evalChoice('q2', '${d.yc1s}')">
                <strong>${d.yc1.split(':')[0]}:</strong> ${d.yc1.substring(10)}
                <div id="q2-fail" class="feedback-box feedback-fail">${d.yc1f}</div>
            </button>
            <button class="choice-btn" onclick="evalChoice('q2', '${d.yc2s}')">
                <strong>${d.yc2.split(':')[0]}:</strong> ${d.yc2.substring(10)}
                <div id="q2-pass" class="feedback-box feedback-success">${d.yc2f}</div>
            </button>

            <!-- STEP 4 -->
            <div class="section-title">🏮 Step 4: Cultural Byte</div>
            <div class="culture-byte">
                <div class="culture-header">💡 GENCHI ANCHOR: ${d.cult_h}</div>
                <div style="line-height: 1.45;">${d.cult_b}</div>
            </div>
        `;

        document.getElementById('dynamic-content').innerHTML = contentHtml;
        window.scrollTo(0,0);
    }

    function nextDay() {
        if (currentDay < 60) {
            currentDay++;
            loadDay(currentDay);
        } else {
            alert("Complete! You have fully run through the 60-Day Genchi baseline array.");
        }
    }

    function prevDay() {
        if (currentDay > 1) {
            currentDay--;
            loadDay(currentDay);
        }
    }

    // Process bootstrap on initial rendering execution
    buildDayScroller();
    loadDay(1);
</script>
