<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast Archive | English Learning App</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --border-color: #334155;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            border-bottom: 1px solid var(--border-color);
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo {
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .brand-logo span {
            color: var(--accent-color);
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        .nav-link:hover {
            color: var(--accent-color);
        }

        main {
            max-width: 1080px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
            width: 100%;
            flex: 1;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 3rem;
        }

        .hero-section h1 {
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 0.75rem;
        }

        .hero-section p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .search-input {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            width: 100%;
            max-width: 320px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .date-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.25rem;
        }

        .date-btn {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.25rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--text-primary);
            text-decoration: none;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .date-btn:hover {
            background-color: var(--card-hover);
            border-color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .date-btn .date-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-color);
            letter-spacing: 0.05em;
            font-family: monospace, monospace;
        }

        .date-btn .sub-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .date-btn .arrow-icon {
            position: absolute;
            bottom: 1.25rem;
            right: 1.25rem;
            opacity: 0.4;
            transition: opacity 0.2s, transform 0.2s;
        }

        .date-btn:hover .arrow-icon {
            opacity: 1;
            transform: translateX(3px);
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="brand-logo">
            🎧 <span>Daily Podcast</span>
        </a>
        <nav>
            <a href="index.html" class="nav-link">← Back to Home</a>
        </nav>
    </header>

    <main>
        <section class="hero-section">
            <h1>Podcast Episodes</h1>
            <p>Select a date to listen to the daily audio module and study materials.</p>
        </section>

        <div class="controls-bar">
            <input 
                type="text" 
                id="searchInput" 
                class="search-input" 
                placeholder="Search by date (e.g. 2026-08)..."
                onkeyup="filterDates()"
            >
        </div>

        <div class="date-grid" id="dateGrid">
            <a href="podcast/html/20260801.html" class="date-btn" data-date="2026-08-01">
                <span class="date-text">2026-08-01</span>
                <span class="arrow-icon">→</span>
            </a>

            <div id="noResults" class="no-results">
                No podcast entry found matching that date.
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 English Learning Application. All rights reserved.</p>
    </footer>

    <script>
        function filterDates() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.date-btn');
            let visibleCount = 0;

            cards.forEach(card => {
                const dateVal = card.getAttribute('data-date');
                if (dateVal.includes(input)) {
                    card.style.display = "flex";
                    visibleCount++;
                } else {
                    card.style.display = "none";
                }
            });

            const noResults = document.getElementById('noResults');
            noResults.style.display = visibleCount === 0 ? "block" : "none";
        }
    </script>
</body>
</html>
